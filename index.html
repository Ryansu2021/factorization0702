<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Web Audio Synthesizer for Retro Game Sound Effects ---
    // 共用單一 AudioContext，避免每次點擊都新建一個造成資源浪費；
    // 並在每次播放前 resume()，因應 iOS Safari 等瀏覽器的自動播放限制。
    let sharedAudioCtx = null;
    const getAudioCtx = () => {
      if (!sharedAudioCtx) {
        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    };

    const playSound = (type) => {
      try {
        const ctx = getAudioCtx();
        if (type === 'success') {
          const now = ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0.08, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.35);
          });
        } else if (type === 'error') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(140, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(90, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'level-up') {
          const now = ctx.currentTime;
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
          notes.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.06, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.25);
          });
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        }
      } catch (e) {
        console.warn("Audio Context blocked or unsupported in this environment.", e);
      }
    };

    // --- Classic Sheet Data (Exact representations of the uploaded image 12857) ---
    // --- 隨機產生「經典數字猜猜樂」題組(取代原本寫死的固定數字) ---
    const generateClassicProblems = () => {
      const givenOptions = [['top', 'left'], ['left', 'bottom'], ['bottom', 'right'], ['top', 'bottom']];
      const usedPairs = new Set();

      const makeOne = (id) => {
        let top, bottom, key;
        do {
          top = Math.floor(Math.random() * 19) - 9; // -9 ~ 9
          bottom = Math.floor(Math.random() * 19) - 9;
          key = `${top}_${bottom}`;
        } while (top === 0 || bottom === 0 || top === bottom || usedPairs.has(key));
        usedPairs.add(key);

        const left = top + bottom;
        const right = top * bottom;
        const given = givenOptions[Math.floor(Math.random() * givenOptions.length)];
        return { id, top, bottom, left, right, given };
      };

      return Array.from({ length: 8 }, (_, i) => makeOne(i + 1));
    };

    // --- 隨機產生「二次式因式分解(卷-1)」題組(取代原本寫死的固定多項式) ---
    const generateWrittenProblems = () => {
      const usedPairs = new Set();

      const makeOne = (id) => {
        let r1, r2, key;
        do {
          r1 = Math.floor(Math.random() * 13) - 6; // -6 ~ 6
          r2 = Math.floor(Math.random() * 13) - 6;
          key = `${r1}_${r2}`;
        } while (r1 === 0 || r2 === 0 || r1 === r2 || r1 === -r2 || usedPairs.has(key));
        usedPairs.add(key);

        const sum = r1 + r2;
        const prod = r1 * r2;
        const sign1 = sum >= 0 ? '+' : '-';
        const sign2 = prod >= 0 ? '+' : '-';
        const displayPoly = `x² ${sign1} ${Math.abs(sum)}x ${sign2} ${Math.abs(prod)}`;
        return { id, roots: [r1, r2], displayPoly, hintSum: sum, hintProd: prod };
      };

      return Array.from({ length: 5 }, (_, i) => makeOne(i + 1));
    };

    // --- 固定版本「A卷」/「B卷」：全班統一數字，方便老師比對「共同錯題」 ---
    const CLASSIC_PROBLEMS_A = [
      { id: 1, top: 2, left: 12, bottom: 10, right: 20, given: ['top', 'left'] },
      { id: 2, top: -6, left: -12, bottom: -6, right: 36, given: ['top', 'left'] },
      { id: 3, left: 10, bottom: 8, top: 2, right: 16, given: ['left', 'bottom'] },
      { id: 4, left: -24, bottom: -12, top: -12, right: 144, given: ['left', 'bottom'] },
      { id: 5, bottom: -4, right: -32, top: 8, left: 4, given: ['bottom', 'right'] },
      { id: 6, top: 8, bottom: -9, left: -1, right: -72, given: ['top', 'bottom'] },
      { id: 7, left: 4, bottom: 7, top: -3, right: -21, given: ['left', 'bottom'] },
      { id: 8, top: 7, left: 8, bottom: 1, right: 7, given: ['top', 'left'] }
    ];

    const CLASSIC_PROBLEMS_B = [
      { id: 1, top: 3, left: 13, bottom: 10, right: 30, given: ['top', 'left'] },
      { id: 2, top: -5, left: -9, bottom: -4, right: 20, given: ['top', 'left'] },
      { id: 3, left: 6, bottom: 9, top: -3, right: -27, given: ['left', 'bottom'] },
      { id: 4, left: -20, bottom: -10, top: -10, right: 100, given: ['left', 'bottom'] },
      { id: 5, bottom: -5, right: -45, top: 9, left: 4, given: ['bottom', 'right'] },
      { id: 6, top: 6, bottom: -7, left: -1, right: -42, given: ['top', 'bottom'] },
      { id: 7, left: 5, bottom: 8, top: -3, right: -24, given: ['left', 'bottom'] },
      { id: 8, top: 9, left: 10, bottom: 1, right: 9, given: ['top', 'left'] }
    ];

    const WRITTEN_PROBLEMS_A = [
      { id: 1, roots: [4, -9], displayPoly: "x² - 5x - 36", hintSum: -5, hintProd: -36 },
      { id: 2, roots: [1, -5], displayPoly: "x² - 4x - 5", hintSum: -4, hintProd: -5 },
      { id: 3, roots: [-2, -6], displayPoly: "x² - 8x + 12", hintSum: -8, hintProd: 12 },
      { id: 4, roots: [-3, -7], displayPoly: "x² - 10x + 21", hintSum: -10, hintProd: 21 },
      { id: 5, roots: [6, -10], displayPoly: "x² - 4x - 60", hintSum: -4, hintProd: -60 }
    ];

    const WRITTEN_PROBLEMS_B = [
      { id: 1, roots: [5, -8], displayPoly: "x² - 3x - 40", hintSum: -3, hintProd: -40 },
      { id: 2, roots: [2, -7], displayPoly: "x² - 5x - 14", hintSum: -5, hintProd: -14 },
      { id: 3, roots: [-3, -5], displayPoly: "x² - 8x + 15", hintSum: -8, hintProd: 15 },
      { id: 4, roots: [-4, -9], displayPoly: "x² - 13x + 36", hintSum: -13, hintProd: 36 },
      { id: 5, roots: [7, -11], displayPoly: "x² - 4x - 77", hintSum: -4, hintProd: -77 }
    ];

    // 依老師/學生選擇的版本('A' / 'B' / 'random')取得對應題組
    const getClassicProblemsForVersion = (version) => {
      if (version === 'A') return CLASSIC_PROBLEMS_A;
      if (version === 'B') return CLASSIC_PROBLEMS_B;
      return generateClassicProblems();
    };
    const getWrittenProblemsForVersion = (version) => {
      if (version === 'A') return WRITTEN_PROBLEMS_A;
      if (version === 'B') return WRITTEN_PROBLEMS_B;
      return generateWrittenProblems();
    };

    // --- 隨機產生「十字交乘(提公因式)」單一練習題 ---
    const generateGroupingProblem = () => {
      let r1, r2;
      do {
        r1 = Math.floor(Math.random() * 13) - 6; // -6 ~ 6
        r2 = Math.floor(Math.random() * 13) - 6;
      } while (r1 === 0 || r2 === 0 || r1 === r2 || r1 === -r2);

      const left = r1 + r2;   // 一次項係數 b
      const right = r1 * r2;  // 常數項 c
      const sign1 = left >= 0 ? '+' : '-';
      const sign2 = right >= 0 ? '+' : '-';
      const displayPoly = `x² ${sign1} ${Math.abs(left)}x ${sign2} ${Math.abs(right)}`;
      return { top: r1, bottom: r2, left, right, displayPoly };
    };

    // --- 隨機產生「B型分解版」練習題：ax²+bx+c，a≠1 ---
    // 由 (px+q)(rx+s) 展開回推，確保一定能整數分解
    const generateBFormProblem = () => {
      const gcd2 = (x, y) => {
        x = Math.abs(x); y = Math.abs(y);
        while (y) { [x, y] = [y, x % y]; }
        return x;
      };
      const coeffChoices = [2, 3];
      let p, q, r, s, a, b, c;
      do {
        p = coeffChoices[Math.floor(Math.random() * coeffChoices.length)];
        r = coeffChoices[Math.floor(Math.random() * coeffChoices.length)];
        q = Math.floor(Math.random() * 9) - 4; // -4 ~ 4
        s = Math.floor(Math.random() * 9) - 4;
        a = p * r;
        b = p * s + q * r;
        c = q * s;
      } while (
        q === 0 || s === 0 || q === -s || p * s === q * r ||
        gcd2(gcd2(a, b), c) !== 1 // 排除 a、b、c 有公因數可先提出來的情況(例如 6x²+10x+4)
      );

      const m = p * s; // 拆項數字一
      const n = q * r; // 拆項數字二
      const sign = (x) => (x >= 0 ? '+' : '-');
      const abs = (x) => Math.abs(x);
      const displayPoly = `${a}x² ${sign(b)}${abs(b)}x ${sign(c)}${abs(c)}`;
      return { a, b, c, p, q, r, s, m, n, product: a * c, sum: b, displayPoly };
    };

    // --- 驗證 B型分解版 的最終因式分解答案：(px+q)(rx+s) 或交換順序皆可 ---
    const checkBFormAnswer = (userAns, p, q, r, s) => {
      if (!userAns) return false;
      const norm = (str) => normalizeFullWidth(str).replace(/\s+/g, '').toLowerCase();
      const fmtFactor = (coef, konst) => `(${coef === 1 ? '' : coef}x${konst >= 0 ? '+' : ''}${konst})`;
      const possible1 = norm(fmtFactor(p, q) + fmtFactor(r, s));
      const possible2 = norm(fmtFactor(r, s) + fmtFactor(p, q));
      const normalized = norm(userAns);
      return normalized === possible1 || normalized === possible2;
    };

    // --- Format Polynomial Nicely ---
    const formatPolynomial = (b, c) => {
      let bPart = '';
      if (b > 0) {
        bPart = b === 1 ? ' + x' : ` + ${b}x`;
      } else if (b < 0) {
        bPart = b === -1 ? ' - x' : ` - ${Math.abs(b)}x`;
      }
      
      let cPart = '';
      if (c > 0) {
        cPart = ` + ${c}`;
      } else if (c < 0) {
        cPart = ` - ${Math.abs(c)}`;
      }
      
      return `x²${bPart}${cPart}`;
    };

    // --- Normalize full-width (全形) characters to half-width ---
    // 中文輸入法或平板容易打出全形括號/符號，這裡統一轉換，避免學生答對卻被判錯。
    const normalizeFullWidth = (str) => {
      return str
        .replace(/（/g, '(')
        .replace(/）/g, ')')
        .replace(/－/g, '-')
        .replace(/﹣/g, '-')
        .replace(/—/g, '-')
        .replace(/＋/g, '+')
        .replace(/ｘ/g, 'x')
        .replace(/Ｘ/g, 'x')
        // 全形數字 0-9 (Unicode FF10-FF19) 轉半形
        .replace(/[\uFF10-\uFF19]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    };

    // --- Robust Factoring Answer Parser ---
    const checkFactoringAnswer = (userAns, correctRoots) => {
      if (!userAns) return false;
      const normalized = normalizeFullWidth(userAns).replace(/\s+/g, '').toLowerCase();
      const [r1, r2] = correctRoots;
      const sign1 = r1 >= 0 ? '+' : '';
      const sign2 = r2 >= 0 ? '+' : '';
      
      const possible1 = `(x${sign1}${r1})(x${sign2}${r2})`.replace(/\s+/g, '').toLowerCase();
      const possible2 = `(x${sign2}${r2})(x${sign1}${r1})`.replace(/\s+/g, '').toLowerCase();
      
      return normalized === possible1 || normalized === possible2;
    };

    // --- 驗證「提公因式(步驟③)」使用者輸入是否正確：x(x+t) ± |b|(x+t) ---
    const checkGroupingStep3 = (userAns, t, b) => {
      if (!userAns || t === null || b === null) return false;
      const normalized = normalizeFullWidth(userAns).replace(/\s+/g, '').toLowerCase();
      const signT = t >= 0 ? '+' : '-';
      const absT = Math.abs(t);
      const signB = b >= 0 ? '+' : '-';
      const absB = Math.abs(b);
      const canonical = `x(x${signT}${absT})${signB}${absB}(x${signT}${absT})`.toLowerCase();
      return normalized === canonical;
    };

    // ==========================================================================
    // --- Firebase Realtime Database 整合設定 ---
    // 用來達成「教師即時監控」：學生一交卷，老師畫面立刻更新，不用等輪詢。
    //
    // 設定步驟(第一次做，大約 5 分鐘)：
    // 1. 開 https://console.firebase.google.com ，用 Google 帳號登入。
    // 2. 「新增專案」，取個名字(例如 cross-multiplication-tool)，一路下一步。
    // 3. 專案建立完成後，點左側「建構」→「Realtime Database」→「建立資料庫」，
    //    地區選離台灣近的(例如 asia-southeast1)，安全性規則先選「測試模式」。
    // 4. 建立完資料庫後，點左上角齒輪「專案設定」，往下捲到「你的應用程式」，
    //    點 </> 網頁圖示，註冊一個應用程式(名稱隨意)，會出現一段 firebaseConfig，
    //    把裡面的 apiKey / authDomain / databaseURL / projectId 幾個值複製起來。
    // 5. 貼到下面的 FIREBASE_CONFIG 物件對應欄位。
    // 6. 【重要】回到 Realtime Database →「規則」分頁，把規則改成下面這樣後發布：
    //      {
    //        "rules": {
    //          "rooms": {
    //            "$roomCode": {
    //              ".read": true,
    //              ".write": true
    //            }
    //          }
    //        }
    //      }
    //    這樣任何人只要知道 ROOM_CODE 才能讀寫該班級的資料，避免完全開放。
    //    (這仍是「知道代碼就能存取」等級的安全性，適合課堂低風險使用；
    //     如果要更嚴謹，之後可以加 Firebase Authentication 再進一步收緊規則。)
    // 7. 存檔，重新整理網頁即可開始使用。若保持 apiKey 為預設提示文字，
    //    這個功能會自動停用，不影響其他分頁正常使用。
    // ==========================================================================
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCUdhr05fn2oUQ-OqrOj5yZUaNo_PVdKN0",
      authDomain: "cross-method.firebaseapp.com",
      databaseURL: "https://cross-method-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cross-method"
    };
    const ROOM_CODE = "class1"; // 教室代碼：不同班級/課程可以改成不同代碼，資料互不相通
    const TEACHER_PASSCODE_SHA256 = "f495f6efe38a463071818b1b232f4b84012c5e6f3c5f90d1aab7bb355a895d61"; // 教師密碼的 SHA-256 雜湊(僅前端門檻，非真正資安機制)
    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const isFirebaseConfigured = () => !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('請貼上');

    let firebaseAppInstance = null;
    const getFirebaseDb = () => {
      if (!firebaseAppInstance) {
        firebaseAppInstance = firebase.initializeApp(FIREBASE_CONFIG);
      }
      return firebase.database();
    };

    // 送出一筆作答紀錄到 Firebase(不阻塞畫面、失敗也不影響學生作答體驗)
    const sendLogToFirebase = (payload) => {
      if (!isFirebaseConfigured()) return;
      try {
        const db = getFirebaseDb();
        db.ref(`rooms/${ROOM_CODE}/submissions`).push({
          ...payload,
          clientTime: new Date().toISOString(),
          serverTime: firebase.database.ServerValue.TIMESTAMP
        }).catch((err) => console.warn('紀錄回傳失敗(不影響作答)：', err));
      } catch (err) {
        console.warn('紀錄回傳失敗(不影響作答)：', err);
      }
    };

    // 訂閱教師監控用的即時資料流。回傳一個「取消訂閱」函式，元件卸載/切頁時要呼叫它。
    const subscribeTeacherRecords = (onData, onError) => {
      const db = getFirebaseDb();
      const ref = db.ref(`rooms/${ROOM_CODE}/submissions`).limitToLast(300);
      const listener = ref.on('value', (snapshot) => {
        const val = snapshot.val() || {};
        const records = Object.entries(val).map(([id, r]) => ({ id, ...r }));
        records.sort((a, b) => (b.serverTime || 0) - (a.serverTime || 0));
        onData(records);
      }, (err) => { if (onError) onError(err); });
      return () => ref.off('value', listener);
    };

    // 刪除一批指定的紀錄(依 id)，用於「清除班級資料」按鈕。
    // 用 multi-path update 一次把多個 key 設為 null，Firebase 會直接刪掉這些節點。
    const deleteRecordsByIds = async (ids) => {
      if (!ids || ids.length === 0) return;
      const db = getFirebaseDb();
      const updates = {};
      ids.forEach(id => { updates[`rooms/${ROOM_CODE}/submissions/${id}`] = null; });
      await db.ref().update(updates);
    };

    // 將畫面上某個 DOM 節點截圖存成 PNG，用於「班級資料截圖」按鈕，方便老師留存學習成果。
    const captureElementAsImage = async (element, filename) => {
      if (!element || typeof html2canvas === 'undefined') return;
      const canvas = await html2canvas(element, { backgroundColor: '#ffffff', scale: 2 });
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    // 將教師監控表格資料匯出成 CSV 並觸發下載
    const exportRecordsToCSV = (records) => {
      if (!records || records.length === 0) return;
      const columns = [
        { key: 'serverTime', label: '時間' },
        { key: 'studentClass', label: '班級' },
        { key: 'studentSeat', label: '座號' },
        { key: 'studentName', label: '代號' },
        { key: 'tab', label: '分頁' },
        { key: 'score', label: '分數' }
      ];
      const escapeCell = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
      const formatCell = (r, key) => key === 'serverTime' && r[key] ? new Date(r[key]).toLocaleString('zh-TW') : r[key];
      const rows = [
        columns.map(c => escapeCell(c.label)).join(','),
        ...records.map(r => columns.map(c => escapeCell(formatCell(r, c.key))).join(','))
      ];
      const csvContent = '\uFEFF' + rows.join('\r\n'); // \uFEFF 讓 Excel 正確辨識 UTF-8
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `十字交乘學習紀錄_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    // --- Lucide Icon Helper ---
    function Icon({ name, className = "w-5 h-5", ...props }) {
      const [svgContent, setSvgContent] = useState("");
      useEffect(() => {
        if (window.lucide) {
          const iconNode = window.lucide.icons[name];
          if (iconNode) {
            const svg = iconNode.map(node => {
              const [tag, attrs] = node;
              const attrString = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ");
              return `<${tag} ${attrString} />`;
            }).join("");
            setSvgContent(svg);
          }
        }
      }, [name]);

      return (
        <svg
          className={`${className} inline-block`}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          dangerouslySetInnerHTML={{ __html: svgContent }}
          {...props}
        />
      );
    }

    // --- Confetti Effect Component ---
    function ConfettiEffect({ trigger }) {
      const [particles, setParticles] = useState([]);

      useEffect(() => {
        if (!trigger) return;
        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
        const list = Array.from({ length: 60 }).map((_, i) => ({
          id: i,
          x: Math.random() * 100, // percentage
          color: colors[Math.floor(Math.random() * colors.length)],
          delay: Math.random() * 0.5,
          duration: 1.5 + Math.random() * 1.5,
          size: 6 + Math.random() * 8
        }));
        setParticles(list);
        const timer = setTimeout(() => setParticles([]), 3500);
        return () => clearTimeout(timer);
      }, [trigger]);

      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none z-50">
          {particles.map(p => (
            <div
              key={p.id}
              className="confetti"
              style={{
                left: `${p.x}%`,
                backgroundColor: p.color,
                width: `${p.size}px`,
                height: `${p.size}px`,
                animationDelay: `${p.delay}s`,

    // --- Cross Component (The Core SVG Math Component) ---
    function CrossItem({
      id,
      top,
      bottom,
      left,
      right,
      given = [],

      onAnswerChange,
      showResults = false,
      isHighlighted = false,
      interactive = true,
      showLiveCalc = true

      const isFieldGiven = (field) => given.includes(field);

      const getUserValue = (field) => {
        if (userAnswers[field] !== undefined) return userAnswers[field];
        if (userAnswers[`${id}_${field}`] !== undefined) return userAnswers[`${id}_${field}`];
        return '';
      };

      const safeParse = (field) => {
        const valStr = getUserValue(field);
        if (valStr === undefined || valStr === '' || valStr === '-') return null;
        return parseInt(valStr);
      };

      const isCorrect = (field) => {
        const valNum = safeParse(field);
        if (valNum === null) return null;

        const topHidden = !given.includes('top');
        const bottomHidden = !given.includes('bottom');

        if (topHidden && bottomHidden && (field === 'top' || field === 'bottom')) {
          const valT = safeParse('top');
          const valB = safeParse('bottom');

          if (field === 'top') {
            if (valB !== null) {
              return (valT === top && valB === bottom) || (valT === bottom && valB === top);
            } else {
              return valT === top || valT === bottom;
            }
          } else { 
            if (valT !== null) {
              return (valT === top && valB === bottom) || (valT === bottom && valB === top);
            } else {
              return valB === top || valB === bottom;
            }
          }
        }

        const expected = field === 'top' ? top : field === 'bottom' ? bottom : field === 'left' ? left : right;
        return valNum === expected;
      };

      const handleInputChange = (field, val) => {
        if (val === '' || val === '-' || /^-?\d+$/.test(val)) {

            {showResults ? (

    // --- Main App Component ---
    // 自動縮放整頁容器：把內容依「視窗寬高」縮放到剛好一頁，不需上下/左右捲動。
    // 以二分搜尋找出最大的縮放比例 scale(≤1)，並讓內容寬度 = 可用寬度 / scale，使版面隨視窗自動重排。
    function FitPage({ enabled, minScale = 0.5, className = '', children }) {
      const outerRef = useRef(null);
      const innerRef = useRef(null);
      const lastRef = useRef({ w: 0, h: 0 });
      const [box, setBox] = useState({ availH: null, scale: 1, width: null, fits: true });

      const fit = () => {
        const outer = outerRef.current, inner = innerRef.current;
        if (!outer || !inner) return;
        if (!enabled) { setBox({ availH: null, scale: 1, width: null, fits: true }); return; }
        const top = outer.getBoundingClientRect().top + window.scrollY;
        const availH = Math.max(240, window.innerHeight - top - 6);
        const cs = getComputedStyle(outer);
        const availW = outer.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
        const measure = (sc) => { inner.style.width = (availW / sc) + 'px'; return inner.offsetHeight * sc; };
        let sc = 1;
        let fits = true;
        if (measure(1) > availH) {
          let lo = minScale, hi = 1;
          for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            if (measure(mid) <= availH) lo = mid; else hi = mid;
          }
          sc = lo;
          fits = measure(sc) <= availH + 1;
        }
        inner.style.width = (availW / sc) + 'px';
        lastRef.current = { w: availW, h: inner.offsetHeight };
        setBox({ availH, scale: sc, width: availW / sc, fits });
      };

      React.useLayoutEffect(() => {
        fit();
        let raf = 0;
        const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(fit); };
        const ro = new ResizeObserver(() => {
          const inner = innerRef.current, outer = outerRef.current;
          if (!inner || !outer) return;
          if (inner.offsetHeight === lastRef.current.h && outer.clientWidth === lastRef.current.w) return;
          schedule();
        });
        if (innerRef.current) ro.observe(innerRef.current);
        if (outerRef.current) ro.observe(outerRef.current);
        window.addEventListener('resize', schedule);
        return () => { ro.disconnect(); window.removeEventListener('resize', schedule); cancelAnimationFrame(raf); };
      }, [enabled, minScale]);

      return (
        <div ref={outerRef} className={className}
          style={enabled && box.availH ? { height: box.availH, overflowX: 'hidden', overflowY: box.fits ? 'hidden' : 'auto' } : undefined}>
          <div ref={innerRef}
            style={enabled && box.width ? { width: box.width, transform: `scale(${box.scale})`, transformOrigin: 'top left' } : undefined}>
            {children}
          </div>
        </div>
      );
    }

        const fa1 = parseField(bFormDraft.a1);

        const cConfirmOk = bFormDraft.cConfirm !== undefined && bFormDraft.cConfirm !== '' && parseInt(bFormDraft.cConfirm) === bFormProblem.c;
        const bp0 = bFormProblem;
        const matchNormal = fa1 === bp0.p && fq === bp0.q && fa2 === bp0.r && fs === bp0.s;
        const matchSwapped = fa1 === bp0.r && fq === bp0.s && fa2 === bp0.p && fs === bp0.q;
        const gridOk = matchNormal || matchSwapped;
        const cross5Ok = fa2 !== null && fq !== null && fCross5 === fa2 * fq;
        const cross6Ok = fa1 !== null && fs !== null && fCross6 === fa1 * fs;
        const answerOk = checkBFormAnswer(bFormFinalAnswer, bFormProblem.p, bFormProblem.q, bFormProblem.r, bFormProblem.s);
        const allOk = aConfirmOk && cConfirmOk && productOk && sumOk && gridOk && cross5Ok && cross6Ok && answerOk;

        if (allOk) {

      // --- TAB 3 Actions (Infinite Challenge) ---
      const generateChallenge = (type = challengeType, difficulty = challengeDifficulty) => {
        let T, B;
        if (difficulty === 'easy') {
          T = Math.floor(Math.random() * 8) + 1;
          B = Math.floor(Math.random() * 8) + 1;
        } else if (difficulty === 'medium') {
          T = Math.floor(Math.random() * 21) - 10; 
          B = Math.floor(Math.random() * 21) - 10;
          if (T === 0) T = 2;
          if (B === 0) B = -3;
        } else {
          T = Math.floor(Math.random() * 31) - 15; 
          B = Math.floor(Math.random() * 31) - 15;
          if (T === 0) T = 7;
          if (B === 0) B = -8;
        }

        const L = T + B;
        const R = T * B;

        let given = [];
        if (type === 'number') {
          const hideMode = Math.random();
          if (hideMode < 0.6) {
            given = ['left', 'right']; 
          } else if (hideMode < 0.8) {
            given = ['top', 'bottom'];
          } else {
            given = Math.random() > 0.5 ? ['top', 'left'] : ['bottom', 'right'];
          }
        } else {
          given = ['left', 'right'];
        }

        setChallengeProblem({ top: T, bottom: B, left: L, right: R, given });
        setChallengeAnswers({});
        setFactoringUserAns('');
        setFactoringDraft({ top: '', bottom: '' });
        setChallengeShowResult(false);
        setChallengeTimer(0);
        setIsTimerRunning(true);

      const submitChallenge = () => {
        if (!challengeProblem) return;
        setIsTimerRunning(false);

        let isAllCorrect = true;
        const p = challengeProblem;
        let wrongItems = [];

        if (challengeType === 'number') {
          const getVal = (f) => {
            const valStr = challengeAnswers[f];
            if (valStr === undefined || valStr === '' || valStr === '-') return null;
            return parseInt(valStr);
          };

          const valT = getVal('top');
          const valB = getVal('bottom');
          const valL = getVal('left');
          const valR = getVal('right');

          const topHidden = !p.given.includes('top');
          const bottomHidden = !p.given.includes('bottom');
          const leftHidden = !p.given.includes('left');
          const rightHidden = !p.given.includes('right');
          const fieldLabels = { top: '上', bottom: '下', left: '左', right: '右' };
          const wrongFields = [];

          if (topHidden && bottomHidden) {
            const matchNormal = (valT === p.top && valB === p.bottom);
            const matchSwapped = (valT === p.bottom && valB === p.top);
            if (!matchNormal && !matchSwapped) {
              isAllCorrect = false;
              wrongFields.push({ field: 'top', correct: p.top, user: valT });
              wrongFields.push({ field: 'bottom', correct: p.bottom, user: valB });
            }
          } else {
            if (topHidden && valT !== p.top) {
              isAllCorrect = false;
              wrongFields.push({ field: 'top', correct: p.top, user: valT });
            }
            if (bottomHidden && valB !== p.bottom) {
              isAllCorrect = false;
              wrongFields.push({ field: 'bottom', correct: p.bottom, user: valB });
            }
          }

          if (leftHidden && valL !== p.left) {
            isAllCorrect = false;
            wrongFields.push({ field: 'left', correct: p.left, user: valL });
          }
          if (rightHidden && valR !== p.right) {
            isAllCorrect = false;
            wrongFields.push({ field: 'right', correct: p.right, user: valR });
          }

          if (!isAllCorrect) {
            wrongItems = [{
              title: `無限挑戰(${challengeDifficulty})`,
              question: `和=${p.left}，積=${p.right}`,
              correctAnswer: wrongFields.map(f => `${fieldLabels[f.field]}=${f.correct}`).join('，'),
              userAnswer: wrongFields.map(f => `${fieldLabels[f.field]}=${f.user === null ? '未作答' : f.user}`).join('，')
            }];
          }

          setChallengeStats(prev => {
            const nextStreak = isAllCorrect ? prev.streak + 1 : 0;
            return {
              correct: prev.correct + (isAllCorrect ? 1 : 0),
              total: prev.total + 1,
              streak: nextStreak,
              bestStreak: Math.max(prev.bestStreak, nextStreak)
            };
          });

        } else {
          isAllCorrect = checkFactoringAnswer(factoringUserAns, [p.top, p.bottom]);

          if (!isAllCorrect) {
            const sum = p.top + p.bottom;
            const prod = p.top * p.bottom;
            const sign1 = p.top >= 0 ? '+' : '';
            const sign2 = p.bottom >= 0 ? '+' : '';
            wrongItems = [{
              title: `無限挑戰-因式分解(${challengeDifficulty})`,
              question: `x²${sum >= 0 ? '+' : ''}${sum}x${prod >= 0 ? '+' : ''}${prod}`,
              correctAnswer: `(x${sign1}${p.top})(x${sign2}${p.bottom})`,
              userAnswer: factoringUserAns || '未作答'
            }];
          }

          setFactoringStats(prev => {
            const nextStreak = isAllCorrect ? prev.streak + 1 : 0;
            return {
              correct: prev.correct + (isAllCorrect ? 1 : 0),
              total: prev.total + 1,
              streak: nextStreak,
              bestStreak: Math.max(prev.bestStreak, nextStreak)
            };
          });
        }

        setChallengeShowResult(true);

        sendLogToFirebase({
          studentClass, studentSeat, studentName,
          tab: challengeType === 'number' ? '無限挑戰-數字猜猜樂' : '無限挑戰-因式分解',
          score: isAllCorrect ? 100 : 0,
          detail: {
            difficulty: challengeDifficulty,
            correct: isAllCorrect,
            wrongItems
          }
        });

        if (isAllCorrect) {
          triggerSound('success');
          setTriggerConfetti(prev => prev + 1);
        } else {
          triggerSound('error');
        }
      };

      // --- TAB 4 Actions ---
      const calculateFactoring = (aStr, bStr) => {
        const sum = parseInt(aStr);
        const prod = parseInt(bStr);

        if (isNaN(sum) || isNaN(prod)) {
          setCalcResult({ error: '請輸入有效的整數！' });
          return;
        }

        const d = sum * sum - 4 * prod;
        if (d < 0) {
          setCalcResult({
            solved: false,
            sum,
            prod,
            reason: '判別式為負數(D = b² - 4ac < 0)，在實數範圍內無解，更無整數解。'
          });
          return;
        }

        const sRoot = Math.sqrt(d);
        if (Math.round(sRoot) * Math.round(sRoot) !== d) {
          setCalcResult({
            solved: false,
            sum,
            prod,
            reason: '無整數解。這意味著此二次式無法以「整數」進行十字交乘因式分解（可用配方法或公式解）。'
          });
          return;
        }

        const t1 = (sum + sRoot) / 2;
        const t2 = (sum - sRoot) / 2;

        if (Number.isInteger(t1) && Number.isInteger(t2)) {
          setCalcResult({
            solved: true,
            top: t1,
            bottom: t2,
            left: sum,
            right: prod
          });
          // Removed automatic beep sound on keypress here to avoid noise in calculator tab
        } else {
          setCalcResult({
            solved: false,
            sum,
            prod,
            reason: '雖然判別式為完全平方數，但因分解根不是整數，故無法使用整數十字分解法。'

      const handleClearClassRecords = async () => {
        const targetRecords = teacherClassFilter === 'all'
          ? teacherRecords
          : teacherRecords.filter(r => r.studentClass === teacherClassFilter);

        );

      const handleCaptureClassRecords = async () => {

                      placeholder="請輸入密碼"
                      className={`w-full px-4 py-2.5 rounded-xl border-2 text-center font-bold focus:outline-none transition-all
                        ${teacherPasscodeError ? 'border-rose-400 bg-rose-50 animate-shake' : 'border-slate-300 focus:border-indigo-500'}`}
                    />
                    {teacherPasscodeError && (
                      <p className="text-xs text-rose-500 font-bold">密碼錯誤，請再試一次</p>
                    )}
                    <button
                      onClick={handleTeacherLogin}
                      className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition-all"
                    >
                      進入監控頁面
                    </button>
                  </div>
                ) : (() => {
                  const filteredRecords = teacherClassFilter === 'all'
                    ? teacherRecords
                    : teacherRecords.filter(r => r.studentClass === teacherClassFilter);

                  // 各分頁平均分數(圖表用)
                  const tabGroups = {};
                  filteredRecords.forEach(r => {
                    if (!r.tab) return;
                    if (!tabGroups[r.tab]) tabGroups[r.tab] = [];
                    tabGroups[r.tab].push(Number(r.score) || 0);
                  });
                  const tabAverages = Object.entries(tabGroups).map(([tab, scores]) => ({
                    label: tab,
                    value: Math.round(scores.reduce((a, b) => a + b, 0) / scores.length),
                    suffix: '分',
                    colorClass: 'bg-indigo-500'
                  })).sort((a, b) => b.value - a.value);

                  const overallAvg = filteredRecords.length > 0
                    ? Math.round(filteredRecords.reduce((sum, r) => sum + (Number(r.score) || 0), 0) / filteredRecords.length)
                    : 0;
                  const passCount = filteredRecords.filter(r => Number(r.score) >= 60).length;
                  const passRate = filteredRecords.length > 0 ? Math.round((passCount / filteredRecords.length) * 100) : 0;

                  // 常見錯題彙整：把每筆紀錄 detail.wrongItems 攤平，依「卷別＋題目內容」分組計數，並記錄「每位學生各自的作答內容」
                  const wrongTally = {};
                  filteredRecords.forEach(r => {
                    const items = r.detail && Array.isArray(r.detail.wrongItems) ? r.detail.wrongItems : [];
                    const studentLabel = `${r.studentClass || '?'}班${r.studentSeat || '?'}號 ${r.studentName || '(未填寫)'}`;
                    // 只有經典數字猜猜樂/卷-1才有examVersion，無限挑戰等其他分頁一律歸類到「其他」
                    const version = (r.detail && r.detail.examVersion) || 'other';
                    items.forEach(item => {
                      const key = `${version}｜${item.title}｜${item.question}`;
                      if (!wrongTally[key]) wrongTally[key] = { ...item, count: 0, answers: [], version };
                      wrongTally[key].count++;
                      wrongTally[key].answers.push({ student: studentLabel, userAnswer: item.userAnswer });
                    });
                  });

                  // 依卷別分組，組內再依「題號」或「錯誤次數」排序(依 wrongSortMode 決定)
                  const versionMeta = {
                    A: { label: 'A卷', badgeClass: 'bg-indigo-100 text-indigo-700' },
                    B: { label: 'B卷', badgeClass: 'bg-violet-100 text-violet-700' },
                    random: { label: '電腦隨機出題', badgeClass: 'bg-amber-100 text-amber-700' },
                    other: { label: '其他(無限挑戰等)', badgeClass: 'bg-slate-200 text-slate-600' }
                  };
                  const extractQuestionNumber = (title) => {
                    const match = title && title.match(/第\s*(\d+)\s*題/);
                    return match ? parseInt(match[1]) : Infinity;
                  };
                  const wrongGroups = ['A', 'B', 'random', 'other']
                    .map(v => ({
                      version: v,
                      meta: versionMeta[v],
                      items: Object.values(wrongTally)
                        .filter(item => item.version === v)
                        .sort((a, b) => wrongSortMode === 'id'
                          ? extractQuestionNumber(a.title) - extractQuestionNumber(b.title)
                          : b.count - a.count)
                        .slice(0, 20)
                    }))
                    .filter(g => g.items.length > 0);

                  // ===== 學生圖卡資料：每位學生一張卡，以燈號顯示學習狀態 =====
                  const nowMs = Date.now();
                  const toMs = (v) => (v ? new Date(v).getTime() || 0 : 0);
                  const studentMap = {};
                  filteredRecords.forEach(r => {
                    const key = `${r.studentClass || '?'}|${r.studentSeat || '?'}|${r.studentName || ''}`;
                    if (!studentMap[key]) studentMap[key] = { key, cls: r.studentClass, seat: r.studentSeat, code: r.studentName, recs: [] };
                    studentMap[key].recs.push(r);
                  });
                  const statusRank = { alert: 0, ok: 1, good: 2 };
                  const students = Object.values(studentMap).map(st => {
                    st.recs.sort((a, b) => toMs(a.serverTime) - toMs(b.serverTime));
                    const last = st.recs[st.recs.length - 1];
                    const prev = [...st.recs].slice(0, -1).reverse().find(x => (x.tab || '') === (last.tab || '')) || null; // 只和「同一分頁」的上一次比較
                    const lastScore = Number(last.score) || 0;
                    const prevScore = prev ? (Number(prev.score) || 0) : null;
                    const bestScore = Math.max(...st.recs.map(x => Number(x.score) || 0));
                    const lastMs = toMs(last.serverTime);
                    const ageMin = lastMs ? (nowMs - lastMs) / 60000 : Infinity;
                    const status = lastScore >= 80 ? 'good' : lastScore >= 60 ? 'ok' : 'alert';
                    const trend = prev === null ? 'new' : lastScore > prevScore ? 'up' : lastScore < prevScore ? 'down' : 'flat';
                    const byTab = {};
                    st.recs.forEach(x => {
                      const t = x.tab || '其他';
                      const sc = Number(x.score) || 0;
                      if (!byTab[t]) byTab[t] = { tab: t, best: sc, last: sc, count: 0 };
                      byTab[t].best = Math.max(byTab[t].best, sc);
                      byTab[t].last = sc;
                      byTab[t].count++;
                    });
                    return { ...st, lastScore, bestScore, lastMs, ageMin, status, trend, attempts: st.recs.length, tabs: Object.values(byTab), perfect: bestScore >= 100 };
                  }).sort((a, b) => statusRank[a.status] - statusRank[b.status] || b.lastMs - a.lastMs);
                  const statusCount = { good: 0, ok: 0, alert: 0 };
                  students.forEach(st => { statusCount[st.status]++; });
                  const visibleStudents = teacherCardFilter === 'all' ? students : students.filter(st => st.status === teacherCardFilter);
                  const statusStyle = {
                    good:  { label: '表現佳', lamp: 'bg-emerald-500', ring: 'ring-emerald-200', border: 'border-emerald-200', bar: 'bg-emerald-500', text: 'text-emerald-600', soft: 'bg-emerald-50', icon: 'CheckCircle2' },
                    ok:    { label: '加油中', lamp: 'bg-amber-400',   ring: 'ring-amber-200',   border: 'border-amber-200',   bar: 'bg-amber-400',   text: 'text-amber-600',   soft: 'bg-amber-50',   icon: 'Clock' },
                    alert: { label: '需關注', lamp: 'bg-rose-500',    ring: 'ring-rose-200',    border: 'border-rose-300',    bar: 'bg-rose-500',    text: 'text-rose-600',    soft: 'bg-rose-50',    icon: 'AlertTriangle' }
                  };
                  const timeAgo = (st) => !st.lastMs ? '-' : st.ageMin < 1 ? '剛剛' : st.ageMin < 60 ? `${Math.floor(st.ageMin)} 分鐘前` : new Date(st.lastMs).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

                  return (
                    <div className="space-y-6">
                      {/* Header / Controls */}
                      <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                          <h2 className="text-xl font-black text-slate-800 flex items-center gap-2">
                            <Icon name="Activity" className="w-5 h-5 text-indigo-500" /> 教師即時監控
                          </h2>
                          <p className="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
                            <span className={`w-2 h-2 rounded-full ${teacherConnected ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}`}></span>
                            {teacherConnected ? '即時連線中' : '連線中...'}
                            {teacherLastSync && `　最後收到資料：${teacherLastSync.toLocaleTimeString('zh-TW')}`}
                          </p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap justify-center">
                          <button
                            onClick={handleCaptureClassRecords}
                            disabled={teacherRecords.length === 0 || teacherCapturing}
                            className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 transition-all disabled:opacity-50"
                          >
                            <Icon name="Camera" className={`w-3.5 h-3.5 ${teacherCapturing ? 'animate-pulse' : ''}`} /> 截圖保存
                          </button>
                          <button
                            onClick={() => exportRecordsToCSV(filteredRecords)}
                            disabled={filteredRecords.length === 0}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 transition-all disabled:opacity-50"
                          >
                            <Icon name="Download" className="w-3.5 h-3.5" /> 匯出 CSV
                          </button>
                          <button
                            onClick={handleClearClassRecords}
                            disabled={filteredRecords.length === 0 || teacherDeleting}
                            className="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 transition-all disabled:opacity-50"
                          >
                            <Icon name="Trash2" className="w-3.5 h-3.5" /> 清除{teacherClassFilter === 'all' ? '全部' : '本班'}資料
                          </button>
                        </div>
                      </div>

                      {teacherError && (
                        <div className="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-xl text-sm">
                          讀取失敗：{teacherError}
                        </div>
                      )}

                      {/* Summary Stats：燈號即篩選器 */}
                      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <button onClick={() => setTeacherCardFilter('all')}
                          className={`bg-white p-4 rounded-2xl border-2 text-center transition-all ${teacherCardFilter === 'all' ? 'border-indigo-400 shadow-md' : 'border-slate-200 hover:border-slate-300'}`}>
                          <Icon name="Users" className="w-5 h-5 text-indigo-500 mx-auto" />
                          <span className="text-2xl font-black text-slate-800 block">{students.length}</span>
                          <span className="text-slate-400 text-xs font-bold">已作答人數</span>
                        </button>
                        {['good', 'ok', 'alert'].map(k => (
                          <button key={k} onClick={() => setTeacherCardFilter(teacherCardFilter === k ? 'all' : k)}
                            className={`bg-white p-4 rounded-2xl border-2 text-center transition-all ${teacherCardFilter === k ? statusStyle[k].border + ' shadow-md' : 'border-slate-200 hover:border-slate-300'}`}>
                            <span className={`inline-block w-4 h-4 rounded-full ${statusStyle[k].lamp} ring-4 ${statusStyle[k].ring}`}></span>
                            <span className="text-2xl font-black text-slate-800 block">{statusCount[k]}</span>
                            <span className={`text-xs font-bold ${statusStyle[k].text}`}>{statusStyle[k].label}{k === 'good' ? '(≥80)' : k === 'ok' ? '(60-79)' : '(<60)'}</span>
                          </button>
                        ))}
                        <div className="bg-white p-4 rounded-2xl border-2 border-slate-200 text-center col-span-2 md:col-span-1">
                          <span className="text-slate-400 text-xs font-bold block uppercase">篩選班級</span>
                          <select
                            value={teacherClassFilter}
                            onChange={(e) => setTeacherClassFilter(e.target.value)}
                            className="mt-1 text-sm font-bold text-indigo-600 bg-transparent focus:outline-none w-full text-center"
                          >
                            <option value="all">全部班級</option>
                            {[...new Set(teacherRecords.map(r => r.studentClass).filter(Boolean))].map(c => (
                              <option key={c} value={c}>{c}</option>
                            ))}
                          </select>
                          <span className="text-[11px] text-slate-400">共 {filteredRecords.length} 筆紀錄</span>
                        </div>
                      </div>

                      {/* 以下內容會被「截圖保存」按鈕整個截圖，方便老師留存學習成果 */}
                      <div ref={teacherCaptureRef} className="space-y-6 bg-slate-50/50 rounded-3xl p-4 -m-4">
                        {/* Charts */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div className="bg-white rounded-3xl border border-slate-200 p-6">
                            <h3 className="text-sm font-black text-slate-700 mb-4 flex items-center gap-1.5">
                              <Icon name="BarChart3" className="w-4 h-4 text-indigo-500" /> 各分頁平均分數
                            </h3>
                            <MiniBarChart data={tabAverages} />
                          </div>
                          <div className="bg-white rounded-3xl border border-slate-200 p-6">
                            <h3 className="text-sm font-black text-slate-700 mb-4 flex items-center gap-1.5">
                              <Icon name="Target" className="w-4 h-4 text-emerald-500" /> 整體表現
                            </h3>
                            <MiniBarChart data={[
                              { label: '平均分數', value: overallAvg, suffix: '分', colorClass: 'bg-emerald-500' },
                              { label: '及格率(≥60分)', value: passRate, suffix: '%', colorClass: 'bg-amber-500' }
                            ]} />
                          </div>
                        </div>

                        {/* 常見錯題 */}
                        <div className="bg-white rounded-3xl border border-slate-200 p-6">
                          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 mb-4">
                            <h3 className="text-sm font-black text-slate-700 flex items-center gap-1.5">
                              <Icon name="AlertTriangle" className="w-4 h-4 text-rose-500" /> 常見錯題(依卷別分組)
                            </h3>
                            <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 shrink-0">
                              {[
                                { key: 'id', label: '依題號排序' },
                                { key: 'count', label: '依錯題數排序' }
                              ].map(opt => (
                                <button
                                  key={opt.key}
                                  onClick={() => setWrongSortMode(opt.key)}
                                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap
                                    ${wrongSortMode === opt.key ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                  {opt.label}
                                </button>
                              ))}
                            </div>
                          </div>
                          {wrongGroups.length === 0 ? (
                            <p className="text-xs text-slate-400 text-center py-4">目前沒有錯題資料(或大家都答對了！)</p>
                          ) : (
                            <div className="space-y-5">
                              {wrongGroups.map(group => (
                                <div key={group.version}>
                                  <div className={`inline-block text-xs font-black px-2.5 py-1 rounded-lg mb-2 ${group.meta.badgeClass}`}>
                                    {group.meta.label}
                                  </div>
                                  <div className="space-y-2">
                                    {group.items.map((item, i) => (
                                      <div key={i} className="flex items-start gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <span className="bg-rose-100 text-rose-600 text-xs font-black px-2 py-1 rounded-lg shrink-0 whitespace-nowrap">錯 {item.count} 次</span>
                                        <div className="text-xs space-y-1 min-w-0 flex-1">
                                          <p className="font-bold text-slate-700">{item.title}：{item.question}</p>
                                          <p className="text-emerald-600">正確答案：{item.correctAnswer}</p>
                                          <div className="pt-0.5 space-y-1">
                                            <span className="font-bold text-rose-500">答錯學生與作答內容：</span>
                                            {item.answers.map((a, ai) => (
                                              <div key={ai} className="flex items-center gap-2 flex-wrap">
                                                <span className="bg-rose-50 border border-rose-100 px-1.5 py-0.5 rounded whitespace-nowrap font-bold text-rose-600">{a.student}</span>
                                                <span className="text-slate-400">{a.userAnswer}</span>
                                              </div>
                                            ))}
                                          </div>
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        {/* 學生圖卡監控 */}
                        <div>
                          <h3 className="text-sm font-black text-slate-700 mb-3 flex items-center gap-1.5">
                            <Icon name="LayoutGrid" className="w-4 h-4 text-indigo-500" /> 學生學習狀態
                            <span className="text-xs font-bold text-slate-400">({visibleStudents.length} 位{teacherCardFilter !== 'all' ? `・${statusStyle[teacherCardFilter].label}` : ''}；需關注者排最前面)</span>
                          </h3>
                          {visibleStudents.length === 0 ? (
                            <div className="bg-white rounded-3xl border border-slate-200 p-10 text-center text-slate-400 text-sm">
                              {teacherLoading ? '資料載入中...' : '尚無符合條件的學生作答紀錄'}
                            </div>
                          ) : (
                            <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))' }}>
                              {visibleStudents.map(st => {
                                const sty = statusStyle[st.status];
                                const live = st.ageMin <= 3;
                                return (
                                  <div key={st.key} className={`bg-white rounded-2xl border-2 ${sty.border} p-3.5 shadow-sm hover:shadow-md transition-all relative overflow-hidden`}>
                                    <div className="flex items-start gap-3">
                                      <div className="relative shrink-0">
                                        <div className={`w-11 h-11 rounded-xl ${sty.soft} ${sty.text} flex items-center justify-center font-black text-lg`}>{st.seat || '?'}</div>
                                        <span className={`absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full ${sty.lamp} border-2 border-white ${live ? 'animate-pulse' : ''}`} title={sty.label}></span>
                                      </div>
                                      <div className="min-w-0 flex-1">
                                        <p className="font-black text-slate-800 text-sm truncate">{st.code || '(未填代號)'}</p>
                                        <p className="text-[11px] text-slate-400">{st.cls || '?'}班 {st.seat || '?'}號</p>
                                      </div>
                                      <div className="flex flex-col items-end gap-1 shrink-0">
                                        <span className={`text-xl font-black leading-none ${sty.text}`}>{st.lastScore}</span>
                                        <span className="flex items-center gap-0.5 text-[11px] font-bold">
                                          {st.trend === 'up' && <><Icon name="TrendingUp" className="w-3.5 h-3.5 text-emerald-500" /><span className="text-emerald-500">進步</span></>}
                                          {st.trend === 'down' && <><Icon name="TrendingDown" className="w-3.5 h-3.5 text-rose-500" /><span className="text-rose-500">退步</span></>}
                                          {st.trend === 'flat' && <><Icon name="Minus" className="w-3.5 h-3.5 text-slate-400" /><span className="text-slate-400">持平</span></>}
                                          {st.trend === 'new' && <span className="text-slate-300">首次</span>}
                                        </span>
                                      </div>
                                    </div>

                                    <div className="mt-3 h-2 bg-slate-100 rounded-full overflow-hidden">
                                      <div className={`h-full ${sty.bar} rounded-full transition-all duration-500`} style={{ width: `${Math.min(100, st.lastScore)}%` }}></div>
                                    </div>

                                    <div className="mt-2.5 flex flex-wrap gap-1">
                                      {st.tabs.slice(0, 4).map(t => (
                                        <span key={t.tab} className="inline-flex items-center gap-1 bg-slate-50 border border-slate-100 rounded-md px-1.5 py-0.5 text-[10px] font-bold text-slate-500 max-w-full" title={`${t.tab}：最近 ${t.last} 分，最高 ${t.best} 分，共 ${t.count} 次`}>
                                          <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${t.last >= 80 ? 'bg-emerald-500' : t.last >= 60 ? 'bg-amber-400' : 'bg-rose-500'}`}></span>
                                          <span className="truncate">{t.tab.replace(/二次式因式分解/, '因式分解').replace(/經典數字猜猜樂/, '猜猜樂')}</span>
                                          <span className="text-slate-700">{t.last}</span>
                                        </span>
                                      ))}
                                      {st.tabs.length > 4 && <span className="text-[10px] text-slate-400 font-bold px-1">+{st.tabs.length - 4}</span>}
                                    </div>

                                    <div className="mt-2.5 flex items-center justify-between text-[11px] text-slate-400 font-bold">
                                      <span className="flex items-center gap-1"><Icon name="Clock" className="w-3 h-3" />{live ? <span className="text-emerald-500">作答中・{timeAgo(st)}</span> : timeAgo(st)}</span>
                                      <span className="flex items-center gap-1.5">
                                        {st.perfect && <span className="flex items-center gap-0.5 text-amber-500" title="曾拿過滿分"><Icon name="Trophy" className="w-3.5 h-3.5" />滿分</span>}
                                        <span className="flex items-center gap-0.5" title="作答次數"><Icon name="RotateCcw" className="w-3 h-3" />{st.attempts}</span>
                                      </span>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                        </div>
                      </div>
                  );
                })()}
              </div>
            )}
          </FitPage>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
