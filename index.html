<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數字猜猜樂 - 十字分解法互動學習網</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX compilation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    /* Confetti animation styles */
    @keyframes confetti-fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
    }
    /* Error shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.2s ease-in-out 0s 2;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Web Audio Synthesizer for Retro Game Sound Effects ---
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'success') {
          const now = ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0.08, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.35);
          });
        } else if (type === 'error') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(140, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(90, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'level-up') {
          const now = ctx.currentTime;
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
          notes.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.06, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.25);
          });
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        }
      } catch (e) {
        console.warn("Audio Context blocked or unsupported in this environment.", e);
      }
    };

    // --- Classic Sheet Data (Exact representations of the uploaded image 12857) ---
    const CLASSIC_PROBLEMS = [
      { id: 1, top: 2, left: 12, bottom: 10, right: 20, given: ['top', 'left'] },
      { id: 2, top: -6, left: -12, bottom: -6, right: 36, given: ['top', 'left'] },
      { id: 3, left: 10, bottom: 8, top: 2, right: 16, given: ['left', 'bottom'] },
      { id: 4, left: -24, bottom: -12, top: -12, right: 144, given: ['left', 'bottom'] },
      { id: 5, bottom: -4, right: -32, top: 8, left: 4, given: ['bottom', 'right'] },
      { id: 6, top: 8, bottom: -9, left: -1, right: -72, given: ['top', 'bottom'] },
      { id: 7, left: 4, bottom: 7, top: -3, right: -21, given: ['left', 'bottom'] },
      { id: 8, top: 7, left: 8, bottom: 1, right: 7, given: ['top', 'left'] }
    ];

    // --- Part 2 Sheet Data (Exact representations of the uploaded image 12859: 十字分解練習 卷-1) ---
    const WRITTEN_PROBLEMS = [
      { id: 1, poly: 'x² - 5x - 36', roots: [4, -9], displayPoly: "x² - 5x - 36", hintSum: -5, hintProd: -36 },
      { id: 2, poly: 'x² - 4x - 5', roots: [1, -5], displayPoly: "x² - 4x - 5", hintSum: -4, hintProd: -5 },
      { id: 3, poly: 'x² - 8x + 12', roots: [-2, -6], displayPoly: "x² - 8x + 12", hintSum: -8, hintProd: 12 },
      { id: 4, poly: 'x² - 10x + 21', roots: [-3, -7], displayPoly: "x² - 10x + 21", hintSum: -10, hintProd: 21 },
      { id: 5, poly: 'x² - 4x - 60', roots: [6, -10], displayPoly: "x² - 4x - 60", hintSum: -4, hintProd: -60 }
    ];

    // --- Format Polynomial Nicely ---
    const formatPolynomial = (b, c) => {
      let bPart = '';
      if (b > 0) {
        bPart = b === 1 ? ' + x' : ` + ${b}x`;
      } else if (b < 0) {
        bPart = b === -1 ? ' - x' : ` - ${Math.abs(b)}x`;
      }
      
      let cPart = '';
      if (c > 0) {
        cPart = ` + ${c}`;
      } else if (c < 0) {
        cPart = ` - ${Math.abs(c)}`;
      }
      
      return `x²${bPart}${cPart}`;
    };

    // --- Robust Factoring Answer Parser ---
    const checkFactoringAnswer = (userAns, correctRoots) => {
      if (!userAns) return false;
      const normalized = userAns.replace(/\s+/g, '').toLowerCase();
      const [r1, r2] = correctRoots;
      const sign1 = r1 >= 0 ? '+' : '';
      const sign2 = r2 >= 0 ? '+' : '';
      
      const possible1 = `(x${sign1}${r1})(x${sign2}${r2})`.replace(/\s+/g, '').toLowerCase();
      const possible2 = `(x${sign2}${r2})(x${sign1}${r1})`.replace(/\s+/g, '').toLowerCase();
      
      return normalized === possible1 || normalized === possible2;
    };

    // --- Lucide Icon Helper ---
    function Icon({ name, className = "w-5 h-5", ...props }) {
      const [svgContent, setSvgContent] = useState("");
      useEffect(() => {
        if (window.lucide) {
          const iconNode = window.lucide.icons[name];
          if (iconNode) {
            const svg = iconNode.map(node => {
              const [tag, attrs] = node;
              const attrString = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ");
              return `<${tag} ${attrString} />`;
            }).join("");
            setSvgContent(svg);
          }
        }
      }, [name]);

      return (
        <svg
          className={`${className} inline-block`}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          dangerouslySetInnerHTML={{ __html: svgContent }}
          {...props}
        />
      );
    }

    // --- Confetti Effect Component ---
    function ConfettiEffect({ trigger }) {
      const [particles, setParticles] = useState([]);

      useEffect(() => {
        if (!trigger) return;
        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
        const list = Array.from({ length: 60 }).map((_, i) => ({
          id: i,
          x: Math.random() * 100, // percentage
          color: colors[Math.floor(Math.random() * colors.length)],
          delay: Math.random() * 0.5,
          duration: 1.5 + Math.random() * 1.5,
          size: 6 + Math.random() * 8
        }));
        setParticles(list);
        const timer = setTimeout(() => setParticles([]), 3500);
        return () => clearTimeout(timer);
      }, [trigger]);

      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none z-50">
          {particles.map(p => (
            <div
              key={p.id}
              className="confetti"
              style={{
                left: `${p.x}%`,
                backgroundColor: p.color,
                width: `${p.size}px`,
                height: `${p.size}px`,
                animationDelay: `${p.delay}s`,
                animationDuration: `${p.duration}s`,
                borderRadius: Math.random() > 0.5 ? '50%' : '2px'
              }}
            />
          ))}
        </div>
      );
    }

    // --- Cross Component (The Core SVG Math Component) ---
    function CrossItem({
      id,
      top,
      bottom,
      left,
      right,
      given = [],
      userAnswers = {},
      onAnswerChange,
      showResults = false,
      isHighlighted = false,
      interactive = true
    }) {
      const isFieldGiven = (field) => given.includes(field);

      const getUserValue = (field) => {
        if (userAnswers[field] !== undefined) return userAnswers[field];
        if (userAnswers[`${id}_${field}`] !== undefined) return userAnswers[`${id}_${field}`];
        return '';
      };

      const safeParse = (field) => {
        const valStr = getUserValue(field);
        if (valStr === undefined || valStr === '' || valStr === '-') return null;
        return parseInt(valStr);
      };

      const isCorrect = (field) => {
        const valNum = safeParse(field);
        if (valNum === null) return null;

        const topHidden = !given.includes('top');
        const bottomHidden = !given.includes('bottom');

        if (topHidden && bottomHidden && (field === 'top' || field === 'bottom')) {
          const valT = safeParse('top');
          const valB = safeParse('bottom');

          if (field === 'top') {
            if (valB !== null) {
              return (valT === top && valB === bottom) || (valT === bottom && valB === top);
            } else {
              return valT === top || valT === bottom;
            }
          } else { 
            if (valT !== null) {
              return (valT === top && valB === bottom) || (valT === bottom && valB === top);
            } else {
              return valB === top || valB === bottom;
            }
          }
        }

        const expected = field === 'top' ? top : field === 'bottom' ? bottom : field === 'left' ? left : right;
        return valNum === expected;
      };

      const handleInputChange = (field, val) => {
        if (val === '' || val === '-' || /^-?\d+$/.test(val)) {
          onAnswerChange(id, field, val);
        }
      };

      const [focusedField, setFocusedField] = useState(null);

      const renderValue = (field, val, placeholder) => {
        const isGiven = isFieldGiven(field);
        const userVal = getUserValue(field);
        const correct = isCorrect(field);

        if (isGiven) {
          return (
            <div className="text-xl font-bold text-slate-800 bg-slate-100/80 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm min-w-[50px] text-center">
              {val}
            </div>
          );
        }

        if (!interactive) {
          return (
            <div className="text-xl font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-200 shadow-sm min-w-[50px] text-center">
              {val}
            </div>
          );
        }

        return (
          <div className="relative group">
            <input
              type="text"
              inputMode="numeric"
              value={userVal}
              onChange={(e) => handleInputChange(field, e.target.value)}
              onFocus={() => { playSound('click'); setFocusedField(field); }}
              onBlur={() => setFocusedField(null)}
              placeholder={placeholder}
              className={`w-14 h-10 text-center text-lg font-bold rounded-lg border-2 transition-all shadow-sm focus:outline-none focus:scale-110 duration-200
                ${showResults
                  ? correct
                    ? 'border-emerald-500 bg-emerald-50 text-emerald-700 shadow-emerald-100'
                    : 'border-rose-500 bg-rose-50 text-rose-700 shadow-rose-100 animate-shake'
                  : 'border-slate-300 hover:border-indigo-400 bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100'
                }`}
              disabled={showResults && correct}
            />
            {showResults && correct && (
              <span className="absolute -top-3 -right-3 bg-emerald-500 text-white rounded-full p-0.5 shadow-md flex items-center justify-center scale-75 animate-bounce">
                <Icon name="Check" className="w-3.5 h-3.5 stroke-[3]" />
              </span>
            )}
            {showResults && correct === false && (
              <span className="absolute -top-3 -right-3 bg-rose-500 text-white rounded-full p-0.5 shadow-md flex items-center justify-center scale-75">
                <Icon name="X" className="w-3.5 h-3.5 stroke-[3]" />
              </span>
            )}
          </div>
        );
      };

      const getLineStyles = () => {
        const baseStyle = "stroke-slate-300 transition-all duration-300";
        let lineTL_BR = baseStyle; 
        let lineTR_BL = baseStyle; 

        if (focusedField === 'left') {
          lineTL_BR = `${baseStyle} stroke-indigo-400 stroke-[3px]`;
          lineTR_BL = `${baseStyle} stroke-indigo-400 stroke-[3px]`;
        } else if (focusedField === 'right') {
          lineTL_BR = `${baseStyle} stroke-violet-400 stroke-[3px]`;
          lineTR_BL = `${baseStyle} stroke-violet-400 stroke-[3px]`;
        }

        return { lineTL_BR, lineTR_BL };
      };

      const { lineTL_BR, lineTR_BL } = getLineStyles();

      // Current values typed by user or prefilled
      const valT = isFieldGiven('top') ? top : safeParse('top');
      const valB = isFieldGiven('bottom') ? bottom : safeParse('bottom');

      return (
        <div className={`relative bg-white rounded-2xl p-6 border transition-all duration-300 flex flex-col items-center justify-center
          ${isHighlighted ? 'border-indigo-500 ring-2 ring-indigo-100 shadow-lg' : 'border-slate-200 shadow-sm hover:shadow-md hover:border-slate-300'}`}
          style={{ minHeight: '190px' }}
        >
          <div className="absolute top-3 left-4 text-sm font-semibold text-slate-400 flex items-center gap-1.5">
            <span className="bg-slate-100 text-slate-600 rounded-md w-6 h-6 flex items-center justify-center font-bold text-xs">{id}</span>
          </div>

          {focusedField === 'left' && (
            <div className="absolute top-2 right-4 bg-indigo-50 text-indigo-700 text-xs font-bold px-2 py-1 rounded-md border border-indigo-100 animate-pulse">
              相加關係：上 + 下 = 左
            </div>
          )}
          {focusedField === 'right' && (
            <div className="absolute top-2 right-4 bg-violet-50 text-violet-700 text-xs font-bold px-2 py-1 rounded-md border border-violet-100 animate-pulse">
              相乘關係：上 × 下 = 右
            </div>
          )}

          <div className="w-full max-w-[190px] h-[120px] relative mt-2 flex items-center justify-center">
            <svg className="absolute inset-0 w-full h-full" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="100" cy="60" r="12" fill="white" className="stroke-slate-100 stroke-[2]" />
              <line x1="20" y1="15" x2="180" y2="105" className={lineTL_BR} strokeWidth="3" strokeLinecap="round" />
              <line x1="20" y1="105" x2="180" y2="15" className={lineTR_BL} strokeWidth="3" strokeLinecap="round" />
              <circle cx="100" cy="60" r="8" className="fill-slate-50 stroke-slate-400" strokeWidth="2" />
              <line x1="96" y1="60" x2="104" y2="60" className="stroke-slate-500" strokeWidth="1.5" />
              <line x1="100" y1="56" x2="100" y2="64" className="stroke-slate-500" strokeWidth="1.5" />
            </svg>

            <div className="absolute top-[-4px] left-1/2 -translate-x-1/2 z-10">
              {renderValue('top', top, '上')}
            </div>
            <div className="absolute top-1/2 left-[12px] -translate-y-1/2 z-10">
              {renderValue('left', left, '左')}
            </div>
            <div className="absolute top-1/2 right-[12px] -translate-y-1/2 z-10">
              {renderValue('right', right, '右')}
            </div>
            <div className="absolute bottom-[-4px] left-1/2 -translate-x-1/2 z-10">
              {renderValue('bottom', bottom, '下')}
            </div>
          </div>

          {/* Bottom Info Row: Dynamic Helper or Final Correct Solution */}
          <div className="mt-4 pt-3 border-t border-slate-100 w-full text-xs text-slate-500">
            {showResults ? (
              <div className="flex flex-col items-center gap-1">
                <span className="font-bold text-slate-700">正確公式解析：</span>
                <div className="flex items-center justify-center gap-3 font-medium flex-wrap text-center">
                  <span className="flex items-center gap-1">
                    <span className="text-indigo-500 font-bold">加法：</span>{top} + ({bottom}) = {left}
                  </span>
                  <span className="text-slate-300">|</span>
                  <span className="flex items-center gap-1">
                    <span className="text-violet-500 font-bold">乘法：</span>{top} × ({bottom}) = {right}
                  </span>
                </div>
              </div>
            ) : (
              interactive && (
                valT !== null && valB !== null ? (
                  <div className="bg-slate-50 p-2 rounded-xl w-full text-center space-y-1">
                    <div className="font-semibold text-slate-600 text-[10px] uppercase tracking-wider">即時配對計算</div>
                    <div className="font-mono flex flex-col items-center gap-0.5 text-[11px]">
                      <span className={valT + valB === left ? "text-emerald-600 font-bold" : "text-slate-500"}>
                        和：{valT} + ({valB}) = {valT + valB} {valT + valB === left ? '✅' : `(目標: ${left})`}
                      </span>
                      <span className={valT * valB === right ? "text-emerald-600 font-bold" : "text-slate-500"}>
                        積：{valT} × ({valB}) = {valT * valB} {valT * valB === right ? '✅' : `(目標: ${right})`}
                      </span>
                    </div>
                  </div>
                ) : (
                  <div className="text-[11px] text-slate-400 italic text-center py-1">填寫上、下兩數進行草稿試算</div>
                )
              )
            )}
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('sheet'); // 'sheet', 'writtenSheet', 'challenge', 'calculator', 'tutorial'
      const [soundOn, setSoundOn] = useState(true);

      // --- Student General Info ---
      const [studentName, setStudentName] = useState('');
      const [studentClass, setStudentClass] = useState('');
      const [studentSeat, setStudentSeat] = useState('');

      // --- TAB 1: Classic Cross Sheet States ---
      const [sheetAnswers, setSheetAnswers] = useState({});
      const [showSheetResults, setShowSheetResults] = useState(false);
      const [sheetCompleted, setSheetCompleted] = useState(false);
      const [score, setScore] = useState(0);
      const [triggerConfetti, setTriggerConfetti] = useState(0);

      // --- TAB 2: Part 2 Algebraic Written Sheet States ---
      // Interactive Example: x^2 - 3x - 4
      const [exampleAnswers, setExampleAnswers] = useState({ top: '', bottom: '' });
      const [exampleStatus, setExampleStatus] = useState(null); // 'correct', 'incorrect', null

      // Written Problems Answers
      const [writtenAnswers, setWrittenAnswers] = useState({});
      const [showWrittenResults, setShowWrittenResults] = useState(false);
      const [writtenScore, setWrittenScore] = useState(0);
      const [writtenCompleted, setWrittenCompleted] = useState(false);
      const [hintProblemId, setHintProblemId] = useState(null); 

      // --- TAB 3: Infinite Challenge States ---
      const [challengeType, setChallengeType] = useState('factoring'); 
      const [challengeDifficulty, setChallengeDifficulty] = useState('medium'); 
      const [challengeProblem, setChallengeProblem] = useState(null);
      const [challengeAnswers, setChallengeAnswers] = useState({}); 
      const [factoringUserAns, setFactoringUserAns] = useState(''); 
      const [factoringDraft, setFactoringDraft] = useState({ top: '', bottom: '' }); 

      // Independent stats for both challenge modes
      const [challengeStats, setChallengeStats] = useState({ correct: 0, total: 0, streak: 0, bestStreak: 0 });
      const [factoringStats, setFactoringStats] = useState({ correct: 0, total: 0, streak: 0, bestStreak: 0 });

      const [challengeShowResult, setChallengeShowResult] = useState(false);
      const [challengeTimer, setChallengeTimer] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // --- TAB 4: Calculator States ---
      const [calcA, setCalcA] = useState('5'); 
      const [calcB, setCalcB] = useState('6');
      const [calcResult, setCalcResult] = useState(null);

      // Timer Effect for Challenge Mode
      useEffect(() => {
        let interval;
        if (isTimerRunning && activeTab === 'challenge') {
          interval = setInterval(() => {
            setChallengeTimer(t => t + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, activeTab]);

      const triggerSound = (type) => {
        if (soundOn) playSound(type);
      };

      // --- TAB 1 actions ---
      const resetClassicSheet = () => {
        setSheetAnswers({});
        setShowSheetResults(false);
        setSheetCompleted(false);
        setScore(0);
        triggerSound('click');
      };

      const handleSheetAnswerChange = (problemId, field, value) => {
        setSheetAnswers(prev => ({ ...prev, [`${problemId}_${field}`]: value }));
      };

      const checkClassicSheet = () => {
        let totalQuestions = 0;
        let correctAnswers = 0;

        CLASSIC_PROBLEMS.forEach(p => {
          const topHidden = !p.given.includes('top');
          const bottomHidden = !p.given.includes('bottom');
          const leftHidden = !p.given.includes('left');
          const rightHidden = !p.given.includes('right');

          const getVal = (f) => {
            const valStr = sheetAnswers[`${p.id}_${f}`];
            if (valStr === undefined || valStr === '' || valStr === '-') return null;
            return parseInt(valStr);
          };

          const valT = getVal('top');
          const valB = getVal('bottom');
          const valL = getVal('left');
          const valR = getVal('right');

          if (topHidden && bottomHidden) {
            totalQuestions += 2;
            const matchNormal = (valT === p.top && valB === p.bottom);
            const matchSwapped = (valT === p.bottom && valB === p.top);
            if (matchNormal || matchSwapped) {
              correctAnswers += 2;
            }
          } else {
            if (topHidden) {
              totalQuestions++;
              if (valT === p.top) correctAnswers++;
            }
            if (bottomHidden) {
              totalQuestions++;
              if (valB === p.bottom) correctAnswers++;
            }
          }

            totalQuestions++;
            if (valL === p.left) correctAnswers++;
          }
          if (rightHidden) {
            totalQuestions++;
            if (valR === p.right) correctAnswers++;
          }
        });

        const calculatedScore = Math.round((correctAnswers / totalQuestions) * 100);
        setScore(calculatedScore);
        setShowSheetResults(true);
        setSheetCompleted(correctAnswers === totalQuestions);

        if (correctAnswers === totalQuestions) {
          triggerSound('level-up');
          setTriggerConfetti(prev => prev + 1);

          triggerSound('error');
          return;

          const valR = getVal('right');

          const bottomHidden = !p.given.includes('bottom');
          const leftHidden = !p.given.includes('left');
          const rightHidden = !p.given.includes('right');

          if (topHidden && bottomHidden) {

            if (bottomHidden && valB !== p.bottom) isAllCorrect = false;

            return {

              total: prev.total + 1,

        const d = sum * sum - 4 * prod;

            sum,
            prod,
            reason: '判別式為負數 ($D = b^2 - 4ac < 0$)，在實數範圍內無解，更無整數解。'

        }

        const sRoot = Math.sqrt(d);
        if (Math.round(sRoot) * Math.round(sRoot) !== d) {

            sum,
            prod,
            reason: '無整數解。這意味著此二次式無法以「整數」進行十字交乘因式分解（可用配方法或公式解）。'

            solved: true,

                          <p className="font-bold flex items-center gap-1.5 text-slate-700">
                            <Icon name="Award" className="w-4 h-4 text-amber-500" />
                            本題正確解答拆解：
                          </p>
                          <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 font-medium space-y-1 text-xs">
                            <p>兩個常數分別是：<strong className="text-teal-600 text-sm">{challengeProblem.top}</strong> 與 <strong className="text-teal-600 text-sm">{challengeProblem.bottom}</strong></p>
                            <p>算式檢驗：{challengeProblem.top} + ({challengeProblem.bottom}) = {challengeProblem.left}（一次項和） | {challengeProblem.top} × ({challengeProblem.bottom}) = {challengeProblem.right}（常數項積）</p>
                            <p className="text-sm font-bold text-indigo-600 mt-1">因式分解答案：(x {challengeProblem.top >= 0 ? `+ ${challengeProblem.top}` : challengeProblem.top})(x {challengeProblem.bottom >= 0 ? `+ ${challengeProblem.bottom}` : challengeProblem.bottom})</p>
                          </div>
                        </div>
                      )}

                      {/* Submit & Next Buttons */}
                      <div className="flex items-center gap-4 pt-2">
                        {challengeShowResult ? (
                          <button
                            onClick={() => {
                              triggerSound('click');
                              generateChallenge(challengeType, challengeDifficulty);
                            }}
                            className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2"
                          >
                            下一題挑戰 <Icon name="ArrowRight" className="w-5 h-5" />
                          </button>
                        ) : (
                          <div className="flex items-center gap-3 w-full">
                            <button
                              onClick={() => {
                                triggerSound('click');
                                generateChallenge(challengeType, challengeDifficulty);
                              }}
                              className="px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl border border-slate-200 transition-all"
                            >
                              跳過此題
                            </button>
                            <button
                              onClick={submitChallenge}
                              className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2"
                            >
                              驗證答案 <Icon name="CheckCircle2" className="w-5 h-5" />
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  ) : (
                    <div className="text-center py-12">
                      <span className="loading text-slate-400">正在準備題目中...</span>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ==================== TAB 4: CROSS FACTORING CALCULATOR ==================== */}
            {activeTab === 'calculator' && (
              <div className="max-w-4xl mx-auto space-y-8">
                <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                  <div>
                    <h2 className="text-2xl font-black text-slate-800">十字交乘法動態計算機</h2>
                    <p className="text-sm text-slate-500 mt-1">
                      輸入您在作業中遇到的多項式係數，系統會立即展示其「十字分解」架構圖並給出完美因式！
                    </p>
                  </div>

                  <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 flex flex-col md:flex-row items-center justify-center gap-4 text-center">
                    <span className="text-2xl font-black text-slate-600">x²</span>
                    <span className="text-2xl font-black text-slate-400">+</span>
                    
                    <div className="flex flex-col items-center gap-2">
                      <div className="relative">
                        <input
                          type="number"
                          value={calcA}
                          onChange={(e) => setCalcA(e.target.value)}
                          className="w-24 h-12 text-center text-xl font-bold rounded-xl border-2 border-slate-300 hover:border-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition-all"
                        />
                        <span className="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] font-bold text-indigo-500 uppercase tracking-wider">相加(和)</span>
                      </div>
                    </div>
                    
                    <span className="text-2xl font-black text-slate-600 ml-1">x</span>
                    <span className="text-2xl font-black text-slate-400">+</span>

                    <div className="flex flex-col items-center gap-2">
                      <div className="relative">
                        <input
                          type="number"
                          value={calcB}
                          onChange={(e) => setCalcB(e.target.value)}
                          className="w-24 h-12 text-center text-xl font-bold rounded-xl border-2 border-slate-300 hover:border-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition-all"
                        />
                        <span className="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] font-bold text-violet-500 uppercase tracking-wider">相乘(積)</span>
                      </div>
                    </div>

                    <span className="text-2xl font-black text-slate-400 md:ml-4">=</span>
                    <span className="text-2xl font-black text-indigo-600">0</span>
                  </div>

                  {calcResult && (
                    <div className="pt-6 border-t border-slate-100 animate-fade-in">
                      {calcResult.error ? (
                        <div className="bg-rose-50 border border-rose-100 text-rose-700 p-4 rounded-xl text-center font-bold">
                          {calcResult.error}
                        </div>
                      ) : calcResult.solved ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                          <div className="flex justify-center">
                            <div className="w-full max-w-[280px]">
                              <CrossItem
                                id="CALC"
                                top={calcResult.top}
                                bottom={calcResult.bottom}
                                left={calcResult.left}
                                right={calcResult.right}
                                given={['top', 'bottom', 'left', 'right']} 
                                interactive={false}
                              />
                            </div>
                          </div>

                          <div className="space-y-4">
                            <h3 className="text-lg font-black text-indigo-950 flex items-center gap-2">
                              <Icon name="Lightbulb" className="w-5 h-5 text-amber-500" />
                              因式分解解析
                            </h3>
                            
                            <div className="space-y-3 text-slate-600 text-sm">
                              <p>
                                我們的任務是尋找兩個整數，滿足：
                              </p>
                              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100 space-y-1.5 font-medium">
                                <p className="flex items-center gap-2">
                                  <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                                  兩數相加等於 <span className="font-bold text-indigo-600">{calcResult.left}</span> (x 的係數)
                                </p>
                                <p className="flex items-center gap-2">
                                  <span className="w-2.5 h-2.5 rounded-full bg-violet-500"></span>
                                  兩數相乘等於 <span className="font-bold text-violet-600">{calcResult.right}</span> (常數項)
                                </p>
                              </div>
                              <p>
                                經過尋找，這兩個整數為：
                                <strong className="text-indigo-600 ml-1">{calcResult.top}</strong> 與 
                                <strong className="text-violet-600 ml-1">{calcResult.bottom}</strong>。
                              </p>
                              <p className="text-base text-slate-800">
                                故原二次多項式可以完美分解為：
                              </p>
                              <div className="bg-indigo-600 text-white p-4 rounded-xl text-center text-xl font-black shadow-md tracking-wide">
                                x² {calcResult.left >= 0 ? `+ ${calcResult.left}` : calcResult.left}x {calcResult.right >= 0 ? `+ ${calcResult.right}` : calcResult.right} 
                                <span className="block text-sm text-indigo-200 mt-1 font-normal">可以分解成</span>
                                (x {calcResult.top >= 0 ? `+ ${calcResult.top}` : calcResult.top}) 
                                (x {calcResult.bottom >= 0 ? `+ ${calcResult.bottom}` : calcResult.bottom})
                              </div>
                            </div>
                          </div>
                        </div>
                      ) : (
                        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-amber-900 space-y-4">
                          <div className="flex items-start gap-3">
                            <div className="p-2 bg-amber-100 rounded-lg text-amber-700">
                              <Icon name="AlertTriangle" className="w-6 h-6" />
                            </div>
                            <div>
                              <h4 className="font-black text-base">此二次式在「整數」範圍內無解</h4>
                              <p className="text-sm mt-1 opacity-90">
                                無法找到一組整數 $p$ 與 $q$ 同時符合 $p + q = {calcResult.sum}$ 且 $p \times q = {calcResult.prod}$。
                              </p>
                            </div>
                          </div>
                          <div className="text-xs text-amber-800/80 leading-relaxed pl-11">
                            <p className="font-semibold mb-1">補充說明：</p>
                            {calcResult.reason}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ==================== TAB 5: EDUCATIONAL TUTORIAL ==================== */}
            {activeTab === 'tutorial' && (
              <div className="max-w-4xl mx-auto space-y-8">
                <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                  <div className="space-y-2">
                    <span className="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase">
                      觀念解說
                    </span>
                    <h2 className="text-2xl font-black text-slate-800">十字分解法與十字十字「數字猜猜樂」的祕密</h2>
                    <p className="text-slate-500 text-sm leading-relaxed">
                      為什麼這個十字交叉圖形對於國中數學的二次式因式分解如此重要？讓我們用最直觀的方式，一步步解開它的祕密。
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center border-t border-slate-100 pt-6">
                    <div className="md:col-span-1 bg-indigo-50 p-5 rounded-2xl border border-indigo-100 text-center space-y-2">
                      <span className="text-xs font-black text-indigo-500 uppercase tracking-widest block">第一階段</span>
                      <h3 className="font-bold text-lg text-indigo-950">多項式乘法展開</h3>
                      <div className="text-sm font-semibold text-indigo-700 py-1 bg-white rounded-lg shadow-inner">
                        (x + a)(x + b)
                      </div>
                    </div>
                    <div className="md:col-span-2 text-slate-600 text-sm space-y-2">
                      <p>
                        當我們計算兩個一次式的乘積時，會使用分配律將它們展開：
                      </p>
                      <div className="bg-slate-50 px-4 py-2 rounded-lg font-mono text-center text-slate-800 border">
                        (x + a)(x + b) = x² + ax + bx + ab
                      </div>
                      <p>
                        將同類項合併之後，我們會得到：
                        <strong className="text-indigo-600 ml-1">x² + (a + b)x + ab</strong>
                      </p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center border-t border-slate-100 pt-6">
                    <div className="md:col-span-1 bg-violet-50 p-5 rounded-2xl border border-violet-100 text-center space-y-2">
                      <span className="text-xs font-black text-violet-500 uppercase tracking-widest block">第二階段</span>
                      <h3 className="font-bold text-lg text-violet-950">觀察係數的關係</h3>
                      <div className="text-sm font-semibold text-violet-700 py-1 bg-white rounded-lg shadow-inner">
                        a + b ＆ a × b
                      </div>
                    </div>
                    <div className="md:col-span-2 text-slate-600 text-sm space-y-2">
                      <p>
                        仔細觀察這個二次多項式：
                        <strong className="text-slate-800 ml-1">x² + <span className="text-indigo-600 font-bold">Sum</span> x + <span className="text-violet-600 font-bold">Product</span></strong>
                      </p>
                      <ul className="list-disc pl-5 space-y-1 text-slate-500">
                        <li>第一項 <span className="font-bold text-slate-700">x 的前係數</span> 就是 $a$ 與 $b$ 的<span className="text-indigo-600 font-bold">「和」</span>(也就是十字架左邊的數字)。</li>
                        <li>最後一項 <span className="font-bold text-slate-700">常數項</span> 就是 $a$ 與 $b$ 的<span className="text-violet-600 font-bold">「積」</span>(也就是十字架右邊的數字)。</li>
                      </ul>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center border-t border-slate-100 pt-6">
                    <div className="md:col-span-1 bg-emerald-50 p-5 rounded-2xl border border-emerald-100 text-center space-y-2">
                      <span className="text-xs font-black text-emerald-500 uppercase tracking-widest block">第三階段</span>
                      <h3 className="font-bold text-lg text-emerald-950">反向工程：十字分解</h3>
                      <div className="text-sm font-semibold text-emerald-700 py-1 bg-white rounded-lg shadow-inner">
                        和在左，積在右
                      </div>
                    </div>
                    <div className="md:col-span-2 text-slate-600 text-sm space-y-2">
                      <p>
                        「因式分解」就是乘法展開的「逆向操作」。當看到一個一元二次方程式，我們要找到那兩個神秘的整數 $a$ 與 $b$：
                      </p>
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-center items-center gap-6 text-xs sm:text-sm">
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> 相加：a + b</span>
                        <span className="text-slate-300">|</span>
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-violet-500"></span> 相乘：a × b</span>
                      </div>
                      <p>
                        這就是為什麼這個數字猜猜樂練習，可以大幅提升你的「數感」與「對數字拆解的直覺」，這正是學好十字交乘法最關鍵的能力！
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
